<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>jwspecfit — navy hex with emission-line bars</title>
  <!-- Flat-top hex outline -->
  <polygon points="78,41.4 178,41.4 228,128 178,214.6 78,214.6 28,128"
           fill="none" stroke="#3A2E5F" stroke-width="7" stroke-linejoin="round"/>
  <!-- Emission-line bars (vertical), spectrum-like -->
  <g stroke="#3A2E5F" stroke-width="6" stroke-linecap="round">
    <line x1="85"  y1="185" x2="85"  y2="165"/>
    <line x1="100" y1="185" x2="100" y2="135"/>
    <line x1="115" y1="185" x2="115" y2="90"/>
    <line x1="128" y1="185" x2="128" y2="68"/>
    <line x1="141" y1="185" x2="141" y2="80"/>
    <line x1="156" y1="185" x2="156" y2="125"/>
    <line x1="171" y1="185" x2="171" y2="155"/>
  </g>
  <!-- Baseline -->
  <line x1="70" y1="185" x2="186" y2="185"
        stroke="#3A2E5F" stroke-width="3" opacity="0.55"/>
</svg>
