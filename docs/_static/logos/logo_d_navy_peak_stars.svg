<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>jwspecfit — navy Gaussian peak with cosmic dots</title>
  <!-- Soft stars / data dots above -->
  <g fill="#3A2E5F">
    <circle cx="52"  cy="48" r="2.5"/>
    <circle cx="84"  cy="32" r="3"/>
    <circle cx="128" cy="22" r="4"/>
    <circle cx="172" cy="32" r="3"/>
    <circle cx="204" cy="48" r="2.5"/>
    <circle cx="220" cy="78" r="2"/>
    <circle cx="36"  cy="78" r="2"/>
  </g>
  <!-- Baseline -->
  <line x1="30" y1="200" x2="226" y2="200"
        stroke="#3A2E5F" stroke-width="3" opacity="0.45"/>
  <!-- Gaussian fit -->
  <polyline points="30,199.8 44,199.5 58,198.0 72,193.5 86,182.0 100,158.5 114,124.5 128,95 142,124.5 156,158.5 170,182.0 184,193.5 198,198.0 212,199.5 226,199.8"
            stroke="#3A2E5F" stroke-width="7" fill="none"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Data points along curve -->
  <g fill="#C9A227" stroke="#3A2E5F" stroke-width="1.5">
    <circle cx="58"  cy="198" r="3.5"/>
    <circle cx="86"  cy="182" r="3.5"/>
    <circle cx="114" cy="124.5" r="3.5"/>
    <circle cx="128" cy="95"  r="4"/>
    <circle cx="142" cy="124.5" r="3.5"/>
    <circle cx="170" cy="182" r="3.5"/>
    <circle cx="198" cy="198" r="3.5"/>
  </g>
</svg>
