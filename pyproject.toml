[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jwspecfit"
version = "1.0.1"
description = "JWST NIRSpec emission-line fitting with resolution-aware Gaussian models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Raunaq Rai", email = "raunaq.rai.22@ucl.ac.uk"},
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "astropy>=5.3",
    "matplotlib>=3.7",

    "tqdm>=4.60",
    "joblib>=1.3",
    "plotly>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]
mcmc = [
    "emcee>=3.1",
    "nautilus-sampler>=0.7",
    "corner>=2.2",
    "h5py>=3.8",
]
nuts = [
    "jax>=0.4",
    "jaxlib>=0.4",
    "numpyro>=0.13",
]
abund = [
    "pyneb>=1.1.25",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jwspecfit = ["data/*.txt"]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
