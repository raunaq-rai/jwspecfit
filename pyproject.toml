[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jwspecfit"
version = "1.1.9"
description = "JWST NIRSpec emission-line fitting with resolution-aware Gaussian models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Raunaq Rai", email = "raunaq.rai.25@ucl.ac.uk"},
]
keywords = [
    "astronomy", "astrophysics", "JWST", "NIRSpec", "spectroscopy",
    "emission-line fitting", "chemical abundances", "MCMC",
    "high-redshift galaxies",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "astropy>=5.3",
    "matplotlib>=3.7",

    "tqdm>=4.60",
    "joblib>=1.3",
    "plotly>=5.0",
]

[project.urls]
Homepage      = "https://github.com/raunaq-rai/jwspecfit"
Documentation = "https://jwspecfit.readthedocs.io/"
Paper         = "https://arxiv.org/abs/2608.10063"
Source        = "https://github.com/raunaq-rai/jwspecfit"
Issues        = "https://github.com/raunaq-rai/jwspecfit/issues"
Changelog     = "https://github.com/raunaq-rai/jwspecfit/blob/main/docs/changelog.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]
mcmc = [
    "emcee>=3.1",
    "nautilus-sampler>=0.7",
    "corner>=2.2",
    "h5py>=3.8",
]
nuts = [
    "jax>=0.4",
    "jaxlib>=0.4",
    "numpyro>=0.13",
]
abund = [
    "pyneb>=1.1.25",
]
dla = [
    "dynesty>=2.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jwspecfit = ["data/*.txt"]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
