name: Publish to PyPI

# Fires on every published GitHub Release.  Uses OIDC trusted publishing —
# no API tokens stored anywhere.  Setup:
#   1. Register pending publisher on PyPI:
#      https://pypi.org/manage/account/publishing/
#      project name: jwspecfit | owner: raunaq-rai | repo: jwspecfit
#      workflow: publish.yml | environment: pypi
#   2. Create GitHub Environment named "pypi" under repo Settings.
on:
  release:
    types: [published]

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade pip build

      - run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/jwspecfit
    permissions:
      id-token: write  # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
